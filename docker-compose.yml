services:
  postgres:
    image: postgres:16-alpine
    container_name: haodaone-db
    environment:
      POSTGRES_DB: haodaone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - haodaone_pgdata:/var/lib/postgresql/data

volumes:
  haodaone_pgdata:
