spring.application.name=haodaone-backend
logging.level.com.haodaone.security=DEBUG
# ==========================================================
# PostgreSQL - shared HaodaAsset database
# ==========================================================
# HaodaOne now runs against the SAME Postgres database as HaodaAsset -
# same DB_URL/DB_USERNAME/DB_PASSWORD env vars HaodaAsset's Render service
# already points at the shared Neon instance. Set these in HaodaOne's own
# Render service to the identical values (never commit real credentials
# here - see application-local.properties.template for local dev).
# Existing tables (employee, app_user, role, permission, department,
# designation, team, leave_type, leave_balance, leave_request, holiday,
# attendance_record, biometric_device, audit_log, login_history,
# refresh_token) are reused as-is. Before first boot against this
# database, run the one-time migration at src/main/resources/db/migration/
# V1__align_with_haoda_asset_shared_schema.sql, which additively brings
# those tables in line with what HaodaOne's entities expect without
# touching or breaking anything HaodaAsset relies on.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
# validate (not update): the shared schema is owned jointly by HaodaAsset
# and the V1 migration above, not auto-generated by this app. This just
# confirms HaodaOne's entity mappings match the real columns on startup
# and fails fast if the migration hasn't been run yet, rather than
# silently trying to alter tables HaodaAsset also depends on.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================================
# Flyway - applies db/migration/V1__..., V2__... on startup
# ==========================================================
# baseline-on-migrate: the shared database already has tables/data from
# HaodaAsset with no flyway_schema_history yet, so Flyway baselines at V0
# on first run instead of refusing to touch a "non-empty, unmanaged"
# schema, then applies V1/V2 on top.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=flyway_schema_history_haodaone
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Server
# ==========================================================
server.port=${PORT:8080}

# ==========================================================
# Resume uploads (Recruitment module - public Careers page)
# ==========================================================
# Migrated off local disk (was ephemeral on Render - see git history for
# the old ResumeStorageService) onto Amazon S3, same pattern as
# HaodaAsset's invoice storage - see ResumeS3StorageService / S3Config.
# Resumes live under the "resumes/" prefix of the SAME bucket
# aws.s3.bucket-name points at below; nothing S3-specific needs
# duplicating here beyond the max-file-size limits.
app.upload.max-resume-size-mb=${MAX_RESUME_SIZE_MB:10}
spring.servlet.multipart.max-file-size=${MAX_RESUME_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${MAX_RESUME_SIZE_MB:10}MB

# ==========================================================
# Amazon S3 (AWS SDK v2) - resume storage, ported from HaodaAsset's
# aws.s3.* / aws.accessKeyId / aws.secretKey convention. Set these env
# vars on HaodaOne's own Render service; they are independent of
# HaodaAsset's - point AWS_S3_BUCKET_NAME at a bucket dedicated to
# HaodaOne (or a shared bucket with a distinct prefix) rather than
# reusing HaodaAsset's invoice bucket.
# ==========================================================
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:haodaone-resumes}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.s3.presigned-url-expiry-minutes=${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES:15}

# ==========================================================
# JWT
# ==========================================================
# app.jwt.secret MUST be overridden with a real random 256-bit+ value before
# any real deployment (e.g. `openssl rand -base64 48`). The default below is
# fine for local dev only.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-before-deploying-anywhere-real-1234567890}
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:15}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# ==========================================================
# CORS
# ==========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================================
# Seed data - initial super admin account. CHANGE THE DEFAULT PASSWORD
# before deploying anywhere real; the account is forced to change it on
# first login regardless (mustChangePassword=true).
# ==========================================================
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@haodaone.local}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:ChangeMe123!}

# ==========================================================
# Transactional email (Recruitment module - manager assignment, offer,
# and employee-welcome emails)
# ==========================================================
# Brevo REST API, not SMTP - Render blocks outbound SMTP, same reasoning
# and provider as HaodaAsset's invoice/notification emails. Get an API
# key from Brevo > Settings > SMTP & API > API Keys and set BREVO_API_KEY
# in Render's environment (or application-local.properties for local
# dev). Leave it unset locally and EmailService just logs instead of
# sending - see its javadoc.
app.email.brevo-api-key=${BREVO_API_KEY:}
app.email.from-address=${EMAIL_FROM_ADDRESS:itsupport@haodapayments.com}
app.email.from-name=${EMAIL_FROM_NAME:HaodaOne Recruitment}
# Base URL of the frontend app, used to build links inside emails (e.g.
# "view candidate" for the hiring manager). No trailing slash.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ==========================================================
# Logging
# ==========================================================
logging.level.com.haodaone=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=WARN
